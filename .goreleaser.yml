version: 2

project_name: exigo

builds:
  - main: .
    binary: exigo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/branow/exigo-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: exigo
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API

nfpms:
  - package_name: exigo
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API
    license: MIT
    bindir: /usr/bin

scoops:
  - name: exigo
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API
    license: MIT

changelog:
  use: git
