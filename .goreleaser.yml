version: 2

project_name: exigo

builds:
  - main: .
    binary: exigo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/branow/exigo-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: exigo
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API
    # The binaries are not signed/notarized with an Apple Developer ID, so
    # strip the quarantine attribute Homebrew puts on cask downloads;
    # otherwise Gatekeeper refuses to run exigo.
    # Written as a custom_block because goreleaser's `hooks` still render the
    # `postflight do` stanza that Homebrew deprecated in favour of
    # `postflight_steps` (goreleaser/goreleaser#6870).
    #
    # Inside postflight_steps the paths are declarative template tokens the
    # installer expands, NOT Ruby: `#{staged_path}` is interpolated at
    # cask-load time against a DSL that has no such method, which makes the
    # whole cask unreadable. The literal {{staged_path}} is what Homebrew
    # expands, wrapped in a goreleaser template string so goreleaser's own
    # {{...}} pass leaves it alone instead of failing on an unknown function.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/exigo"]
        end
      end

nfpms:
  - package_name: exigo
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API
    license: MIT
    bindir: /usr/bin

scoops:
  - name: exigo
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/exigo-cli
    description: Command-line interface for the Exigo direct-selling back-office API
    license: MIT

changelog:
  use: git
